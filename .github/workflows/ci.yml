name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthbridge
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/healthbridge
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/healthbridge
      SEED_PIN: '4321'
      SEED_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --flavor store
      - run: flutter build apk --debug --flavor managed
      # TRD §3 rule 2: Play rejects the store build if SEND_SMS leaks in (e.g. via a plugin manifest).
      - name: Only the managed build may request SMS permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-store-debug.apk > store.txt
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-managed-debug.apk > managed.txt
          if grep -q SMS store.txt; then echo "::error::store build requests SMS permissions"; cat store.txt; exit 1; fi
          grep -q SEND_SMS managed.txt || { echo "::error::managed build lost SEND_SMS"; exit 1; }
