name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run typecheck
      # Against the Firebase emulators under the offline-only project demo-healthbridge.
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --flavor store
      - run: flutter build apk --debug --flavor managed
      # TRD §3 rule 2: Play rejects the store build if SEND_SMS leaks in (e.g. via a plugin manifest).
      - name: Only the managed build may request SMS permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-store-debug.apk > store.txt
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-managed-debug.apk > managed.txt
          if grep -q SMS store.txt; then echo "::error::store build requests SMS permissions"; cat store.txt; exit 1; fi
          grep -q SEND_SMS managed.txt || { echo "::error::managed build lost SEND_SMS"; exit 1; }
