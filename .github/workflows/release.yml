name: Release

# Push a tag like v1.0.0 to run this. Repository settings needed (Settings → Secrets and variables → Actions):
#   secrets: PROD_DIRECT_URL (Neon direct URL), ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS,
#            ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD
#   variables: API_URL (the Vercel API URL), SMS_GATEWAY_NUMBER (Africa's Talking shortcode or number)
on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the GitHub release

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:migrate

  android:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Write the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - run: flutter pub get
      - name: Build (store bundle for Play, managed APK for programme phones)
        env:
          DEFINES: --dart-define=API_URL=${{ vars.API_URL }} --dart-define=SMS_GATEWAY_NUMBER=${{ vars.SMS_GATEWAY_NUMBER }}
        run: |
          flutter build appbundle --release --flavor store $DEFINES
          flutter build apk --release --flavor store $DEFINES
          flutter build apk --release --flavor managed $DEFINES
      # TRD §3 rule 2: Play rejects the store build if SEND_SMS leaks in.
      - name: Only the managed build may request SMS permissions
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          if "$AAPT" dump permissions build/app/outputs/flutter-apk/app-store-release.apk | grep -q SMS; then
            echo "::error::store build requests SMS permissions"; exit 1
          fi
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-managed-release.apk | grep -q SEND_SMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/bundle/storeRelease/app-store-release.aab
            build/app/outputs/flutter-apk/app-managed-release.apk
      - name: Remove the signing key
        if: always()
        run: rm -f android/app/release.jks android/key.properties
